# Opt-in host-network LiveKit without restarting or changing Caddy/Cloudflare.
# Caddy keeps its existing /rtc reverse_proxy livekit:7880 upstream.
# A tiny signaling bridge has the Docker-network DNS alias "livekit"
# and proxies WebSockets/HTTP requests to host-networked LiveKit.
# Requires Docker Compose v2.24+ for !reset.
services:
  livekit:
    network_mode: host
    ports: !reset []
    networks: !reset []
  media-signaling-bridge:
    image: caddy:2-alpine
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/media-signaling.Caddyfile"]
    volumes:
      - ./media-signaling.Caddyfile:/etc/caddy/media-signaling.Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "7880"
    networks:
      backend:
        aliases:
          - livekit
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
