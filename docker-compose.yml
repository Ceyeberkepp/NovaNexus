services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: novanexus
      POSTGRES_USER: novanexus
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novanexus -d novanexus"]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    # PostgreSQL entrypoint needs ownership permissions when initializing a new volume.
    networks: [backend]
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://novanexus:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/novanexus
      NODE_ENV: production
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set a unique random temporary administrator password}
      PORT: 3000
      TRUST_PROXY: "1"
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Generate LiveKit key in installer}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Generate LiveKit secret in installer}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
    expose: ["3000"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [backend]
  ollama:
    image: ollama/ollama:0.12.10
    restart: unless-stopped
    volumes:
      - ollamadata:/root/.ollama
    expose: ["11434"]
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
  livekit:
    image: livekit/livekit-server:v1.13.10
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
    security_opt: ["no-new-privileges:true"]
    networks: [backend]
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app, livekit]
    environment:
      NOVANEXUS_DOMAIN: ${NOVANEXUS_DOMAIN:?Domain required}
      TLS_EMAIL: ${TLS_EMAIL:?Email required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    networks: [backend]
volumes:
  pgdata:
  caddydata:
  caddyconfig:
  ollamadata:
networks:
  backend: {}
