services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: novanexus
      POSTGRES_USER: novanexus
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novanexus -d novanexus"]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    # PostgreSQL entrypoint needs ownership permissions when initializing a new volume.
    networks: [backend]
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://novanexus:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/novanexus
      NODE_ENV: production
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set a unique random temporary administrator password}
      PORT: 3000
      TRUST_PROXY: "1"
    expose: ["3000"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [backend]
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    environment:
      NOVANEXUS_DOMAIN: ${NOVANEXUS_DOMAIN:?Domain required}
      TLS_EMAIL: ${TLS_EMAIL:?Email required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    networks: [backend]
volumes:
  pgdata:
  caddydata:
  caddyconfig:
networks:
  backend: {}
