name: NovaNexus CI
permissions:
  contents: read
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build-and-auth-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: novanexus
          POSTGRES_USER: novanexus
          POSTGRES_PASSWORD: test_password_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U novanexus"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://novanexus:test_password_only@127.0.0.1:5432/novanexus
      BOOTSTRAP_ADMIN_PASSWORD: integration-test-temporary-administrator-password-very-long
      LIVEKIT_API_KEY: novanexus
      LIVEKIT_API_SECRET: integration-test-livekit-secret-with-32-or-more-characters
      NODE_ENV: development
      PORT: 3000
      OLLAMA_URL: http://127.0.0.1:19000
      OLLAMA_MODEL: qwen2.5:0.5b
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Verify installer port detection
        run: |
          bash -n scripts/install.sh scripts/activate-media-host.sh
          bash scripts/test-port-detection.sh
          bash scripts/test-media-fallback.sh
          bash scripts/test-media-host.sh
      - name: Build frontend
        run: |
          npm install --no-audit --no-fund
          npm run check
      - name: Test screen-share priority and active speaker stage selection
        run: node src/meeting-stage.test.mjs
      - name: Verify local and Cloudflare call signaling origins
        run: node --test tests/meeting-origin.test.mjs
      - name: Test meeting camera publication and remote subscription diagnostics
        run: node --test tests/meeting-diagnostics.test.mjs
      - name: Verify Go backend
        run: |
          go mod tidy
          gofmt -w backend
          go vet ./backend
          go test ./backend
          go build -o /tmp/novanexus ./backend
      - name: Start mock local AI backend for API integration test
        run: |
          cat > /tmp/nova-ai-mock.py <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  data = json.loads(self.rfile.read(length))
                  if self.path != '/api/chat' or not data.get('messages'):
                      self.send_error(400)
                      return
                  reply = json.dumps({'message': {'role': 'assistant', 'content': 'Nexus AI test response.'}}).encode()
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(reply)))
                  self.end_headers()
                  self.wfile.write(reply)
          HTTPServer(('127.0.0.1', 19000), Handler).serve_forever()
          PY
          python3 /tmp/nova-ai-mock.py > /tmp/nova-ai-mock.log 2>&1 &
      - name: Start Go API
        run: |
          /tmp/novanexus > /tmp/novanexus.log 2>&1 &
          for n in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/novanexus.log
          exit 1
      - name: Verify bootstrap authentication
        run: |
          set -euo pipefail
          base=http://127.0.0.1:3000
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/users")" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"email":"admin","password":"admin"}' "$base/api/auth/login")" = "401"
          curl --fail --silent -c /tmp/nova-cookie -H 'Content-Type: application/json' -d '{"email":"admin","password":"integration-test-temporary-administrator-password-very-long"}' "$base/api/auth/login" > /tmp/login.json
          grep -q 'must_change_password' /tmp/login.json
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/nova-cookie "$base/api/users")" = "401"
          curl --fail --silent -b /tmp/nova-cookie -H 'Content-Type: application/json' -d '{"currentPassword":"integration-test-temporary-administrator-password-very-long","newPassword":"integration-test-new-secure-password"}' "$base/api/auth/change-password" | grep -q 'true'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/nova-cookie "$base/api/users")" = "401"
          curl --fail --silent -c /tmp/nova-cookie2 -H 'Content-Type: application/json' -d '{"email":"admin","password":"integration-test-new-secure-password"}' "$base/api/auth/login" | grep -q '"Admin"'
          curl --fail --silent -b /tmp/nova-cookie2 "$base/api/auth/me" | grep -q '"terms_required":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/nova-cookie2 "$base/api/users")" = "401"
          version="$(curl -fsS "$base/api/terms" | python3 -c 'import sys,json;print(json.load(sys.stdin)["version"])')"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/nova-cookie2 -H 'Content-Type: application/json' -d '{"version":"invalid","accept":true}' "$base/api/terms")" = "400"
          curl -fsS -b /tmp/nova-cookie2 -H 'Content-Type: application/json' -d "{\"version\":\"$version\",\"accept\":true}" "$base/api/terms" | grep -q '"terms_required":false'
          curl --fail --silent -b /tmp/nova-cookie2 "$base/api/users" | grep -q '"users"'
      - name: Verify authenticated presence and user-controlled availability
        run: |
          set -euo pipefail
          base=http://127.0.0.1:3000
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/presence")" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"mode":"busy","idle":false}' "$base/api/presence")" = "401"
          curl -fsS -b /tmp/nova-cookie2 -H 'Content-Type: application/json' -d '{"mode":"busy","idle":false}' "$base/api/presence" | grep -q '"ok":true'
          curl -fsS -b /tmp/nova-cookie2 "$base/api/presence" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["presence"]["1"]=="busy",d'
          curl -fsS -b /tmp/nova-cookie2 -H 'Content-Type: application/json' -d '{"idle":true}' "$base/api/presence" | grep -q '"ok":true'
          curl -fsS -b /tmp/nova-cookie2 "$base/api/presence" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["presence"]["1"]=="busy",d'
          curl -fsS -b /tmp/nova-cookie2 -H 'Content-Type: application/json' -d '{"mode":"available","idle":true}' "$base/api/presence" | grep -q '"ok":true'
          curl -fsS -b /tmp/nova-cookie2 "$base/api/presence" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["presence"]["1"]=="away",d'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/nova-cookie2 -H 'Content-Type: application/json' -d '{"mode":"invalid","idle":false}' "$base/api/presence")" = "400"
      - name: Verify eight-character passwords, persisted calendar and direct messages
        run: |
          set -euo pipefail
          base=http://127.0.0.1:3000
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/nova-cookie2 -H 'Content-Type: application/json' -d '{"name":"Second User","email":"second@local.invalid","password":"1234567"}' "$base/api/users")" = "400"
          curl -fsS -b /tmp/nova-cookie2 -H 'Content-Type: application/json' -d '{"name":"Second User","email":"second@local.invalid","password":"12345678"}' "$base/api/users" > /tmp/nova-second.json
          grep -q 'second@local.invalid' /tmp/nova-second.json
          second_id=$(python3 -c 'import json; print(json.load(open("/tmp/nova-second.json"))["user"]["id"])')
          curl -fsS -b /tmp/nova-cookie2 -H 'Content-Type: application/json' -d '{"title":"Persisted Calendar Event","date":"2026-12-01","time":"14:30","duration":60}' "$base/api/calendar" | grep -q 'Persisted Calendar Event'
          curl -fsS -b /tmp/nova-cookie2 "$base/api/calendar" | grep -q 'Persisted Calendar Event'
          curl -fsS -b /tmp/nova-cookie2 -H 'Content-Type: application/json' -d '{"text":"Hello from backend integration"}' "$base/api/messages?peer=$second_id" | grep -q 'Hello from backend integration'
          curl -fsS -b /tmp/nova-cookie2 "$base/api/messages?peer=$second_id" | grep -q 'Hello from backend integration'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/calendar")" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/messages?peer=$second_id")" = "401"
          curl -fsS -c /tmp/nova-second-cookie -H 'Content-Type: application/json' -d '{"email":"second@local.invalid","password":"12345678"}' "$base/api/auth/login" > /tmp/nova-second-login.json
          second_terms_version="$(curl -fsS "$base/api/terms" | python3 -c 'import sys,json;print(json.load(sys.stdin)["version"])')"
          curl -fsS -b /tmp/nova-second-cookie -H 'Content-Type: application/json' -d "{\"version\":\"$second_terms_version\",\"accept\":true}" "$base/api/terms" | grep -q '"terms_required":false'
          curl -fsS -b /tmp/nova-second-cookie "$base/api/messages?peer=1" | grep -q 'Hello from backend integration'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/nova-second-cookie "$base/api/calendar")" = "200"
      - name: Verify eight-digit meeting ID, direct calls and breakout management
        run: |
          set -euo pipefail
          base=http://127.0.0.1:3000
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"room":"12345678"}' "$base/api/meetings/token")" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/nova-cookie2 -H 'Content-Type: application/json' -d '{"room":"TeamDemo"}' "$base/api/meetings/token")" = "400"
          curl -fsS -b /tmp/nova-cookie2 -H 'Content-Type: application/json' -d '{}' "$base/api/meetings/create" > /tmp/nova-meeting.json
          meeting=$(python3 -c 'import json,re;v=json.load(open("/tmp/nova-meeting.json"));assert re.fullmatch(r"[0-9]{8}",v["room"]);assert v["urlPath"]=="/"+v["room"];print(v["room"])')
          curl -fsS -b /tmp/nova-cookie2 -H 'Content-Type: application/json' -d "{\"room\":\"$meeting\",\"maxParticipants\":1000}" "$base/api/meetings/token" > /tmp/meeting-token.json
          python3 -c 'import json,base64;v=json.load(open("/tmp/meeting-token.json"));p=v["token"].split(".");assert len(p)==3;claims=json.loads(base64.urlsafe_b64decode(p[1]+"==="));assert claims["video"]["room"]==json.load(open("/tmp/nova-meeting.json"))["room"];assert claims["roomConfig"]["maxParticipants"]==1000'
          curl -fsS -b /tmp/nova-cookie2 -H 'Content-Type: application/json' -d "{\"room\":\"$meeting\",\"maxParticipants\":1}" "$base/api/meetings/token" | grep -q '"maxParticipants":1'
          curl -fsS -b /tmp/nova-cookie2 -H 'Content-Type: application/json' -d "{\"parent\":\"$meeting\",\"action\":\"create\",\"name\":\"Engineering\"}" "$base/api/meetings/breakouts" > /tmp/nova-breakout.json
          breakout_id=$(python3 -c 'import json;print(json.load(open("/tmp/nova-breakout.json"))["id"])')
          curl -fsS -b /tmp/nova-cookie2 "$base/api/meetings/breakouts?parent=$meeting" | grep -q 'Engineering'
          second_id=$(python3 -c 'import json;print(json.load(open("/tmp/nova-second.json"))["user"]["id"])')
          curl -fsS -b /tmp/nova-cookie2 -H 'Content-Type: application/json' -d "{\"parent\":\"$meeting\",\"action\":\"assign\",\"breakoutID\":$breakout_id,\"userID\":$second_id}" "$base/api/meetings/breakouts" | grep -q true
          curl -fsS -b /tmp/nova-second-cookie -H 'Content-Type: application/json' -d "{\"room\":\"$meeting\",\"breakoutID\":$breakout_id}" "$base/api/meetings/token" | grep -q '"breakoutId":'
          curl -fsS -b /tmp/nova-cookie2 -H 'Content-Type: application/json' -d "{\"recipientID\":$second_id,\"action\":\"start\"}" "$base/api/calls" > /tmp/nova-call.json
          call_id=$(python3 -c 'import json;print(json.load(open("/tmp/nova-call.json"))["id"])')
          call_room=$(python3 -c 'import json;print(json.load(open("/tmp/nova-call.json"))["room"])')
          curl -fsS -b /tmp/nova-second-cookie "$base/api/calls" | grep -q "$call_room"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/nova-second-cookie -H 'Content-Type: application/json' -d "{\"room\":\"$call_room\"}" "$base/api/meetings/token")" = "403"
          curl -fsS -b /tmp/nova-second-cookie -H 'Content-Type: application/json' -d "{\"callID\":$call_id,\"action\":\"accept\"}" "$base/api/calls" | grep -q accepted
          curl -fsS -b /tmp/nova-second-cookie -H 'Content-Type: application/json' -d "{\"room\":\"$call_room\"}" "$base/api/meetings/token" | grep -q '"token":'
          curl -fsS -b /tmp/nova-cookie2 -H 'Content-Type: application/json' -d "{\"recipientID\":$second_id,\"action\":\"start\"}" "$base/api/calls" > /tmp/nova-call2.json
          next_call=$(python3 -c 'import json;print(json.load(open("/tmp/nova-call2.json"))["id"])')
          curl -fsS -b /tmp/nova-second-cookie -H 'Content-Type: application/json' -d "{\"callID\":$next_call,\"action\":\"decline\"}" "$base/api/calls" | grep -q declined
      - name: Verify editable Admin settings and groups
        run: |
          set -euo pipefail
          base=http://127.0.0.1:3000
          curl -fsS -b /tmp/nova-cookie2 "$base/api/admin/directory" | grep -q second@local.invalid
          curl -fsS -b /tmp/nova-cookie2 -X PUT -H "Content-Type: application/json" -d '{"workspaceName":"Development Workspace","defaultMeetingLimit":25,"sessionMinutes":30,"waitingRoomEnabled":false,"waitingRoomMessage":"Wait for your host","aiEnabled":true}' "$base/api/admin/settings" | grep -q true
          curl -fsS -b /tmp/nova-cookie2 "$base/api/workspace/settings" | grep -q "Development Workspace"
          curl -fsS -b /tmp/nova-cookie2 -X PUT -H 'Content-Type: application/json' -d '{"workspaceName":"Development Workspace","meetingPublicURL":"https://nexu.cyverax.com","defaultMeetingLimit":25,"sessionMinutes":30,"waitingRoomEnabled":false,"waitingRoomMessage":"Wait for your host","aiEnabled":true}' "$base/api/admin/settings" | grep -q true
          curl -fsS -b /tmp/nova-cookie2 "$base/api/workspace/settings" | grep -q 'nexu.cyverax.com'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/nova-cookie2 -X PUT -H 'Content-Type: application/json' -d '{"workspaceName":"Development Workspace","meetingPublicURL":"http://unsecured.example.com","defaultMeetingLimit":25,"sessionMinutes":30,"waitingRoomEnabled":false,"waitingRoomMessage":"Wait","aiEnabled":true}' "$base/api/admin/settings")" = "400"
          curl -fsS -b /tmp/nova-cookie2 -H "Content-Type: application/json" -d '{"name":"Test Group","description":"Integration"}' "$base/api/admin/groups" | grep -q id
          curl -fsS -b /tmp/nova-cookie2 "$base/api/admin/groups" | grep -q "Test Group"
          curl -fsS -b /tmp/nova-cookie2 "$base/api/admin/logs" | grep -q settings.updated
      - name: Verify default Nexus branding paths
        run: |
          node -e "const fs=require('fs');const b=fs.readFileSync('backend/branding.go','utf8');for(const p of ['/nexus-workspace-logo.svg','/nexus-workspace-icon.svg'])if(!b.includes(p))throw Error('Missing default '+p)"
      - name: Verify persistent branding assets and validation
        run: |
          set -euo pipefail
          base=http://127.0.0.1:3000
          png='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ZXxQAAAAASUVORK5CYII='
          payload=$(printf '{"key":"login_logo","data":"%s"}' "$png")
          curl -fsS -b /tmp/nova-cookie2 -X PUT -H 'Content-Type: application/json' -d "$payload" "$base/api/admin/branding" | grep -q true
          curl -fsS "$base/api/branding" | grep -q 'data:image/png;base64'
          curl -fsS -b /tmp/nova-cookie2 "$base/api/admin/settings" | grep -q 'login_logo'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/nova-second-cookie -X PUT -H 'Content-Type: application/json' -d "$payload" "$base/api/admin/branding")" = "403"
      - name: Verify Admin password reset and AI policy
        run: |
          set -euo pipefail
          base=http://127.0.0.1:3000
          second_id=$(python3 -c 'import json;print(json.load(open("/tmp/nova-second.json"))["user"]["id"])')
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/nova-cookie2 -H 'Content-Type: application/json' -d "{\"userID\":$second_id,\"newPassword\":\"short\",\"adminPassword\":\"integration-test-new-secure-password\"}" "$base/api/admin/reset-password")" = "400"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/nova-cookie2 -H 'Content-Type: application/json' -d "{\"userID\":$second_id,\"newPassword\":\"chosen-by-admin-123\",\"adminPassword\":\"wrong-password\"}" "$base/api/admin/reset-password")" = "401"
          curl -fsS -b /tmp/nova-cookie2 -H 'Content-Type: application/json' -d "{\"userID\":$second_id,\"newPassword\":\"chosen-by-admin-123\",\"adminPassword\":\"integration-test-new-secure-password\"}" "$base/api/admin/reset-password" > /tmp/nova-password-reset.json
          python3 -c 'import json;v=json.load(open("/tmp/nova-password-reset.json"));assert v["ok"] and v["mustChange"] and "temporaryPassword" not in v'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/nova-second-cookie "$base/api/auth/me")" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"email":"second@local.invalid","password":"12345678"}' "$base/api/auth/login")" = "401"
          curl -fsS -H 'Content-Type: application/json' -d '{"email":"second@local.invalid","password":"chosen-by-admin-123"}' "$base/api/auth/login" | grep -q '"must_change_password":true'
          curl -fsS -b /tmp/nova-cookie2 -X PUT -H 'Content-Type: application/json' -d '{"workspaceName":"Development Workspace","defaultMeetingLimit":25,"sessionMinutes":30,"waitingRoomEnabled":true,"waitingRoomMessage":"Please wait","aiEnabled":false}' "$base/api/admin/settings" | grep -q true
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/nova-cookie2 -H 'Content-Type: application/json' -d '{"messages":[{"role":"user","content":"hello"}]}' "$base/api/assistant/chat")" = "403"
          curl -fsS -b /tmp/nova-cookie2 -X PUT -H 'Content-Type: application/json' -d '{"workspaceName":"Development Workspace","defaultMeetingLimit":25,"sessionMinutes":30,"waitingRoomEnabled":false,"waitingRoomMessage":"Wait for your host","aiEnabled":true}' "$base/api/admin/settings" | grep -q true
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"messages":[{"role":"user","content":"hello"}]}' "$base/api/assistant/chat")" = "401"
      - name: Verify authenticated local AI response routing
        run: |
          set -euo pipefail
          base=http://127.0.0.1:3000
          curl -fsS -b /tmp/nova-cookie2 -H 'Content-Type: application/json' -d '{"messages":[{"role":"user","content":"Hello AI"}]}' "$base/api/assistant/chat" | grep -q 'Nexus AI test response'
      - name: Verify SAML setup authorization and fail-closed authentication
        run: |
          set -euo pipefail
          base=http://127.0.0.1:3000
          # SAML is only configured, not an active login mechanism.
          curl -fsS "$base/api/auth/saml/status" | python3 -c 'import json,sys; s=json.load(sys.stdin); assert s["enabled"] is False'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/auth/saml/start")" = "503"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/admin/security/saml")" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/nova-second-cookie "$base/api/admin/security/saml")" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/nova-cookie2 -X PUT -H 'Content-Type: application/json' -d '{"entityID":"https://example.test/idp","loginURL":"http://example.test/sso","certificate":"invalid"}' "$base/api/admin/security/saml")" = "400"
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 2 -subj "/CN=NovaNexus Test Identity Provider" -addext "keyUsage=critical,digitalSignature" -keyout /tmp/nova-idp-private.key -out /tmp/nova-idp-public.crt 2>/dev/null
          python3 - <<'PY'
          import json
          cert=open('/tmp/nova-idp-public.crt').read()
          with open('/tmp/nova-saml-config.json','w') as f:
              json.dump({'entityID':'https://idp.example.test/saml','loginURL':'https://idp.example.test/sso','certificate':cert},f)
          PY
          curl -fsS -b /tmp/nova-cookie2 -X PUT -H 'Content-Type: application/json' --data-binary @/tmp/nova-saml-config.json "$base/api/admin/security/saml" | python3 -c 'import json,sys; s=json.load(sys.stdin); assert s["ok"] and s["enabled"] is False'
          curl -fsS -b /tmp/nova-cookie2 "$base/api/admin/security/saml" | python3 -c 'import json,sys; s=json.load(sys.stdin); assert s["configuration"]["entityID"]=="https://idp.example.test/saml"; assert s["enabled"] is False'
          curl -fsS "$base/api/auth/saml/status" | python3 -c 'import json,sys; s=json.load(sys.stdin); assert s["enabled"] is False and "certificate" not in s'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/auth/saml/start")" = "503"
          rm -f /tmp/nova-idp-private.key /tmp/nova-idp-public.crt /tmp/nova-saml-config.json
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
