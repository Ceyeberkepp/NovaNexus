name: NovaNexus CI
permissions:
  contents: read
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build-and-auth-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: novanexus
          POSTGRES_USER: novanexus
          POSTGRES_PASSWORD: test_password_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U novanexus"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://novanexus:test_password_only@127.0.0.1:5432/novanexus
      BOOTSTRAP_SETUP_CODE: integration-test-setup-code-very-long-secret
      NODE_ENV: development
      PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build frontend
        run: |
          npm install --no-audit --no-fund
          npm run check
      - name: Verify Go backend
        run: |
          go mod tidy
          gofmt -w backend
          go vet ./backend
          go test ./backend
          go build -o /tmp/novanexus ./backend
      - name: Start Go API
        run: |
          /tmp/novanexus > /tmp/novanexus.log 2>&1 &
          for n in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/novanexus.log
          exit 1
      - name: Verify bootstrap authentication
        run: |
          set -euo pipefail
          base=http://127.0.0.1:3000
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/users")" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"email":"admin","password":"admin"}' "$base/api/auth/login")" = "401"
          curl --fail --silent -c /tmp/nova-cookie -H 'Content-Type: application/json' -d '{"email":"admin","password":"admin","setupCode":"integration-test-setup-code-very-long-secret"}' "$base/api/auth/login" > /tmp/login.json
          grep -q 'must_change_password' /tmp/login.json
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/nova-cookie "$base/api/users")" = "403"
          curl --fail --silent -b /tmp/nova-cookie -H 'Content-Type: application/json' -d '{"currentPassword":"admin","newPassword":"integration-test-new-secure-password","setupCode":"integration-test-setup-code-very-long-secret"}' "$base/api/auth/change-password" | grep -q 'true'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/nova-cookie "$base/api/users")" = "401"
          curl --fail --silent -c /tmp/nova-cookie2 -H 'Content-Type: application/json' -d '{"email":"admin","password":"integration-test-new-secure-password"}' "$base/api/auth/login" | grep -q '"Admin"'
          curl --fail --silent -b /tmp/nova-cookie2 "$base/api/users" | grep -q '"users"'
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
