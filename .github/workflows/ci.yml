name: NovaNexus CI
permissions:
  contents: read
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build-and-auth-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: novanexus
          POSTGRES_USER: novanexus
          POSTGRES_PASSWORD: test_password_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U novanexus"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://novanexus:test_password_only@127.0.0.1:5432/novanexus
      BOOTSTRAP_ADMIN_PASSWORD: integration-test-temporary-administrator-password-very-long
      LIVEKIT_API_KEY: novanexus
      LIVEKIT_API_SECRET: integration-test-livekit-secret-with-32-or-more-characters
      NODE_ENV: development
      PORT: 3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Build frontend
        run: |
          npm install --no-audit --no-fund
          npm run check
      - name: Verify Go backend
        run: |
          go mod tidy
          gofmt -w backend
          go vet ./backend
          go test ./backend
          go build -o /tmp/novanexus ./backend
      - name: Start Go API
        run: |
          /tmp/novanexus > /tmp/novanexus.log 2>&1 &
          for n in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/novanexus.log
          exit 1
      - name: Verify bootstrap authentication
        run: |
          set -euo pipefail
          base=http://127.0.0.1:3000
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/users")" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"email":"admin","password":"admin"}' "$base/api/auth/login")" = "401"
          curl --fail --silent -c /tmp/nova-cookie -H 'Content-Type: application/json' -d '{"email":"admin","password":"integration-test-temporary-administrator-password-very-long"}' "$base/api/auth/login" > /tmp/login.json
          grep -q 'must_change_password' /tmp/login.json
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/nova-cookie "$base/api/users")" = "403"
          curl --fail --silent -b /tmp/nova-cookie -H 'Content-Type: application/json' -d '{"currentPassword":"integration-test-temporary-administrator-password-very-long","newPassword":"integration-test-new-secure-password"}' "$base/api/auth/change-password" | grep -q 'true'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/nova-cookie "$base/api/users")" = "401"
          curl --fail --silent -c /tmp/nova-cookie2 -H 'Content-Type: application/json' -d '{"email":"admin","password":"integration-test-new-secure-password"}' "$base/api/auth/login" | grep -q '"Admin"'
          curl --fail --silent -b /tmp/nova-cookie2 "$base/api/users" | grep -q '"users"'
      - name: Verify eight-character passwords, persisted calendar and direct messages
        run: |
          set -euo pipefail
          base=http://127.0.0.1:3000
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/nova-cookie2 -H 'Content-Type: application/json' -d '{"name":"Second User","email":"second@local.invalid","password":"1234567"}' "$base/api/users")" = "400"
          curl -fsS -b /tmp/nova-cookie2 -H 'Content-Type: application/json' -d '{"name":"Second User","email":"second@local.invalid","password":"12345678"}' "$base/api/users" > /tmp/nova-second.json
          grep -q 'second@local.invalid' /tmp/nova-second.json
          second_id=$(python3 -c 'import json; print(json.load(open("/tmp/nova-second.json"))["user"]["id"])')
          curl -fsS -b /tmp/nova-cookie2 -H 'Content-Type: application/json' -d '{"title":"Persisted Calendar Event","date":"2026-12-01","time":"14:30","duration":60}' "$base/api/calendar" | grep -q 'Persisted Calendar Event'
          curl -fsS -b /tmp/nova-cookie2 "$base/api/calendar" | grep -q 'Persisted Calendar Event'
          curl -fsS -b /tmp/nova-cookie2 -H 'Content-Type: application/json' -d '{"text":"Hello from backend integration"}' "$base/api/messages?peer=$second_id" | grep -q 'Hello from backend integration'
          curl -fsS -b /tmp/nova-cookie2 "$base/api/messages?peer=$second_id" | grep -q 'Hello from backend integration'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/calendar")" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/messages?peer=$second_id")" = "401"
          curl -fsS -c /tmp/nova-second-cookie -H 'Content-Type: application/json' -d '{"email":"second@local.invalid","password":"12345678"}' "$base/api/auth/login" > /tmp/nova-second-login.json
          curl -fsS -b /tmp/nova-second-cookie "$base/api/messages?peer=1" | grep -q 'Hello from backend integration'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/nova-second-cookie "$base/api/calendar")" = "200"
      - name: Verify meeting token access and 1000-user policy
        run: |
          set -euo pipefail
          base=http://127.0.0.1:3000
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"room":"TeamDemo","maxParticipants":1000}' "$base/api/meetings/token")" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/nova-cookie2 -H 'Content-Type: application/json' -d '{"room":"TeamDemo","maxParticipants":1001}' "$base/api/meetings/token")" = "400"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/nova-cookie2 -H 'Content-Type: application/json' -d '{"room":"invalid room","maxParticipants":50}' "$base/api/meetings/token")" = "400"
          curl -fsS -b /tmp/nova-cookie2 -H 'Content-Type: application/json' -d '{"room":"TeamDemo","maxParticipants":1000}' "$base/api/meetings/token" > /tmp/meeting-token.json
          python3 -c 'import json,base64;v=json.load(open("/tmp/meeting-token.json"));p=v["token"].split("."); assert len(p)==3;claims=json.loads(base64.urlsafe_b64decode(p[1]+"==="));assert claims["video"]["room"]=="TeamDemo";assert claims["roomConfig"]["maxParticipants"]==1000;assert v["maxParticipants"]==1000'
          curl -fsS -b /tmp/nova-cookie2 -H 'Content-Type: application/json' -d '{"room":"SmallMeeting","maxParticipants":1}' "$base/api/meetings/token" | grep -q '"maxParticipants":1'
      - name: Verify editable Admin settings and groups
        run: |
          set -euo pipefail
          base=http://127.0.0.1:3000
          curl -fsS -b /tmp/nova-cookie2 "$base/api/admin/directory" | grep -q second@local.invalid
          curl -fsS -b /tmp/nova-cookie2 -X PUT -H "Content-Type: application/json" -d '{"workspaceName":"Development Workspace","defaultMeetingLimit":25,"sessionMinutes":30,"waitingRoomEnabled":false,"waitingRoomMessage":"Wait for your host","aiEnabled":true}' "$base/api/admin/settings" | grep -q true
          curl -fsS -b /tmp/nova-cookie2 "$base/api/workspace/settings" | grep -q "Development Workspace"
          curl -fsS -b /tmp/nova-cookie2 -H "Content-Type: application/json" -d '{"name":"Test Group","description":"Integration"}' "$base/api/admin/groups" | grep -q id
          curl -fsS -b /tmp/nova-cookie2 "$base/api/admin/groups" | grep -q "Test Group"
          curl -fsS -b /tmp/nova-cookie2 "$base/api/admin/logs" | grep -q settings.updated
      - name: Verify persistent branding assets and validation
        run: |
          set -euo pipefail
          base=http://127.0.0.1:3000
          png='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ZXxQAAAAASUVORK5CYII='
          payload=$(printf '{"key":"login_logo","data":"%s"}' "$png")
          curl -fsS -b /tmp/nova-cookie2 -X PUT -H 'Content-Type: application/json' -d "$payload" "$base/api/admin/branding" | grep -q true
          curl -fsS "$base/api/branding" | grep -q 'data:image/png;base64'
          curl -fsS -b /tmp/nova-cookie2 "$base/api/admin/settings" | grep -q 'login_logo'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/nova-second-cookie -X PUT -H 'Content-Type: application/json' -d "$payload" "$base/api/admin/branding")" = "403"
      - name: Verify Admin password reset and AI policy
        run: |
          set -euo pipefail
          base=http://127.0.0.1:3000
          second_id=$(python3 -c 'import json;print(json.load(open("/tmp/nova-second.json"))["user"]["id"])')
          curl -fsS -b /tmp/nova-cookie2 -H 'Content-Type: application/json' -d "{\"userID\":$second_id}" "$base/api/admin/reset-password" > /tmp/nova-password-reset.json
          python3 -c 'import json;v=json.load(open("/tmp/nova-password-reset.json"));assert len(v["temporaryPassword"])>=24 and v["mustChange"]'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/nova-second-cookie "$base/api/auth/me")" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"email":"second@local.invalid","password":"12345678"}' "$base/api/auth/login")" = "401"
          temp_password=$(python3 -c 'import json;print(json.load(open("/tmp/nova-password-reset.json"))["temporaryPassword"])')
          curl -fsS -H 'Content-Type: application/json' -d "{\"email\":\"second@local.invalid\",\"password\":\"$temp_password\"}" "$base/api/auth/login" | grep -q '"must_change_password":true'
          curl -fsS -b /tmp/nova-cookie2 -X PUT -H 'Content-Type: application/json' -d '{"workspaceName":"Development Workspace","defaultMeetingLimit":25,"sessionMinutes":30,"waitingRoomEnabled":true,"waitingRoomMessage":"Please wait","aiEnabled":false}' "$base/api/admin/settings" | grep -q true
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/nova-cookie2 -H 'Content-Type: application/json' -d '{"messages":[{"role":"user","content":"hello"}]}' "$base/api/assistant/chat")" = "403"
          curl -fsS -b /tmp/nova-cookie2 -X PUT -H 'Content-Type: application/json' -d '{"workspaceName":"Development Workspace","defaultMeetingLimit":25,"sessionMinutes":30,"waitingRoomEnabled":false,"waitingRoomMessage":"Wait for your host","aiEnabled":true}' "$base/api/admin/settings" | grep -q true
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"messages":[{"role":"user","content":"hello"}]}' "$base/api/assistant/chat")" = "401"
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
