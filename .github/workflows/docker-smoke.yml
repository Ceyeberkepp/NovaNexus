name: NovaNexus container smoke test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_PASSWORD: ci-only-database-password
      BOOTSTRAP_ADMIN_PASSWORD: ci-only-temporary-administrator-password-long-enough
      LIVEKIT_API_KEY: novanexus
      LIVEKIT_API_SECRET: ci-only-livekit-secret-at-least-32-characters
      NOVANEXUS_DOMAIN: nexus.example.test
      TLS_EMAIL: ci@example.test
    steps:
      - uses: actions/checkout@v7
      - name: Prepare LiveKit media server configuration
        run: |
          cat > livekit.yaml <<'EOF'
          port: 7880
          rtc:
            tcp_port: 7881
            udp_port: 7882
            use_external_ip: false
            node_ip: 127.0.0.1
          room:
            max_participants: 1000
          keys:
            novanexus: ci-only-livekit-secret-at-least-32-characters
          EOF
      - name: Check installer syntax and runtime manifest
        run: |
          bash -n scripts/install.sh
          bash -n scripts/check-media.sh
          grep -q 'NOVANEXUS_MEDIA_MODE=public' scripts/install.sh
          grep -q 'use_external_ip: true' scripts/install.sh
          grep -q 'Cloudflare HTTP tunnels carry WSS signaling' scripts/check-media.sh
          docker compose config --quiet
          bash scripts/test-media-host.sh
          docker compose -f docker-compose.yml -f docker-compose.media-host.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.media-host.yml config --format json |
            python3 -c 'import json,sys; s=json.load(sys.stdin)["services"]; lk=s["livekit"]; assert lk.get("network_mode")=="host",lk; assert not lk.get("ports"),lk; assert not lk.get("networks"),lk; assert "media-signaling-bridge" in s; assert s["https"]["environment"]["LIVEKIT_SIGNALING_UPSTREAM"]=="livekit:7880"; assert "https" not in s["media-signaling-bridge"].get("depends_on",{})'
          test -f Dockerfile
          test -f Caddyfile
          test -s public/nexus-workspace-logo.svg
          grep -q "/nexus-workspace-logo.svg" index.html
          grep -q "/nexus-workspace-logo.svg" src/App.jsx
      - name: Simulate restricted logo permissions seen on the deployed server
        run: chmod 600 public/nexus-workspace-logo.svg public/nexus-workspace-icon.svg
      - name: Build non-root Go API image
        run: docker compose build app
      - name: Start PostgreSQL and Go API
        run: docker compose up -d db app
      - name: Verify container boot and internal health
        run: |
          set -euo pipefail
          # The app can be starting even after Docker says its container
          # is running. Retry both checks, not just the /api/health request.
          # Avoid SIGPIPE/pipefail aborting when a command is temporarily down.
          for i in $(seq 1 45); do
            health="$(docker compose exec -T app wget -q -O - http://127.0.0.1:3000/api/health 2>/dev/null || true)"
            homepage="$(docker compose exec -T app wget -q -O - http://127.0.0.1:3000/ 2>/dev/null || true)"
            if [[ "$health" == *'"ok"'* && "$homepage" == *'Nexus Workspace'* ]]; then
              echo "Go API and frontend passed readiness checks."
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail=100 app db
          exit 1
      - name: Verify frontend startup and missing asset behavior
        run: |
          set -euo pipefail
          docker compose exec -T app wget -qO- http://127.0.0.1:3000/ | grep -q 'nova-startup'
          docker compose exec -T app wget -qO- http://127.0.0.1:3000/boot-health.js | grep -q 'could not load'
          docker compose exec -T app test -s /app/dist/nexus-workspace-logo.svg
          docker compose exec -T app test -s /app/dist/nexus-workspace-icon.svg
          docker compose exec -T app wget -qO- http://127.0.0.1:3000/nexus-workspace-logo.svg | grep -q '<svg'
          docker compose exec -T app wget -qO- http://127.0.0.1:3000/nexus-workspace-icon.svg | grep -q '<svg'
          svg_headers=$(docker compose exec -T app wget -S -O /dev/null http://127.0.0.1:3000/nexus-workspace-logo.svg 2>&1)
          grep -qi 'Content-Type: image/svg+xml' <<< "$svg_headers"
          missing_logo=$(docker compose exec -T app wget -S -O /dev/null http://127.0.0.1:3000/missing-brand.svg 2>&1 || true)
          grep -q '404' <<< "$missing_logo"
          response=$(docker compose exec -T app wget -S -O /dev/null http://127.0.0.1:3000/assets/missing-file.js 2>&1 || true)
          printf '%s' "$response" | grep -q '404'
      - name: Verify IP-only HTTPS with local CA
        run: |
          set -euo pipefail
          grep -q 'default_sni {$NOVANEXUS_DOMAIN}' Caddyfile
          grep -q '^:443 {' Caddyfile
          sed -i '/^{$NOVANEXUS_DOMAIN} {/a\    tls internal' Caddyfile
          NOVANEXUS_DOMAIN=127.0.0.1 docker compose up -d https
          docker compose ps --status running livekit
          docker compose up -d ollama
          docker compose exec -T ollama ollama list >/dev/null
          docker compose exec -T https caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          for n in $(seq 1 30); do
            if docker compose exec -T https cat /data/caddy/pki/authorities/local/root.crt > /tmp/novanexus-local-ca.crt 2>/dev/null && test -s /tmp/novanexus-local-ca.crt; then
              if curl -fsS --noproxy "*" --resolve "127.0.0.1:443:127.0.0.1" --cacert /tmp/novanexus-local-ca.crt https://127.0.0.1/api/health | grep -q '"status":"ok"'; then
                curl -fsS --noproxy "*" --resolve "127.0.0.1:443:127.0.0.1" --cacert /tmp/novanexus-local-ca.crt -H "Host: tunnel.example.test" https://127.0.0.1/api/health | grep -q '"status":"ok"'
                exit 0
              fi
            fi
            sleep 2
          done
          docker compose logs --tail=100 https app db
          exit 1
      - name: Verify simultaneous LAN IP and second HTTPS hostname
        run: |
          set -euo pipefail
          cat > additional-sites.caddy <<'EOF'
          nexus-public.example.test {
              tls internal
              import novanexus_routes
          }
          EOF
          docker compose exec -T https caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker compose restart https
          for n in $(seq 1 20); do
            if curl -fsS --noproxy "*" --resolve "nexus-public.example.test:443:127.0.0.1" --cacert /tmp/novanexus-local-ca.crt https://nexus-public.example.test/api/health | grep -q '"status":"ok"'; then
              curl -fsS --noproxy "*" --resolve "127.0.0.1:443:127.0.0.1" --cacert /tmp/novanexus-local-ca.crt https://127.0.0.1/api/health | grep -q '"status":"ok"'
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail=80 https
          exit 1
      - name: Verify embedded authenticated TURN UDP starts
        run: |
          set -euo pipefail
          cat >> livekit.yaml <<'EOF'
          turn:
            enabled: true
            udp_port: 3478
          EOF
          docker compose up -d --force-recreate livekit
          sleep 4
          docker compose ps --status running livekit | grep -q livekit
          docker compose logs --tail=30 livekit
      - name: Verify optional host-network signaling without recreating HTTPS
        run: |
          set -euo pipefail
          https_before="$(docker inspect -f '{{.Id}}' novanexus-https-1)"
          docker compose -f docker-compose.yml -f docker-compose.media-host.yml \
            up -d --no-deps --force-recreate livekit media-signaling-bridge
          test "$(docker inspect -f '{{.Id}}' novanexus-https-1)" = "$https_before"
          docker compose -f docker-compose.yml -f docker-compose.media-host.yml ps --status running media-signaling-bridge | grep -q media-signaling-bridge
          docker compose -f docker-compose.yml -f docker-compose.media-host.yml ps --status running livekit | grep -q livekit
          # The bridged alias must respond on LiveKit's 7880 signaling socket.
          connected=0
          for attempt in $(seq 1 20); do
            response="$(docker compose exec -T https wget -S -O /dev/null http://livekit:7880/ 2>&1 || true)"
            if grep -Eq 'HTTP/[0-9.]+ (200|400|404)' <<< "$response"; then
              connected=1
              break
            fi
            sleep 1
          done
          if [ "$connected" -ne 1 ]; then
            docker compose -f docker-compose.yml -f docker-compose.media-host.yml logs --tail=50 livekit media-signaling-bridge
            exit 1
          fi
          curl -fkSs --noproxy '*' https://127.0.0.1/api/health | grep -q '"status":"ok"'
      - name: Diagnose single Cloudflare HTTPS origin on port 443
        run: |
          set -euo pipefail
          bash -n scripts/check-cloudflare-origin.sh
          temp_root="$(mktemp -d)"
          printf '%s\n' 'NOVANEXUS_DOMAIN=127.0.0.1' > "$temp_root/.env"
          cp /tmp/novanexus-local-ca.crt "$temp_root/novanexus-local-root-ca.crt"
          # Capture the whole diagnostic: grep -q on a live pipe can close
          # stdout early, causing echo to fail under pipefail (SIGPIPE).
          origin_report="$(NOVANEXUS_ROOT_DIR="$temp_root" bash scripts/check-cloudflare-origin.sh)"
          grep -q 'PASS: Original HTTPS endpoint' <<< "$origin_report"
          grep -q 'PASS: Tunnel Host header accepted' <<< "$origin_report"
          rm -rf "$temp_root"
          docker compose config --format json | python3 -c 'import sys,json; ports=json.load(sys.stdin)["services"]["https"]["ports"]; assert sorted((str(p["target"]),p["protocol"]) for p in ports)==[("443","tcp"),("443","udp"),("80","tcp")],ports'
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=100 app db
      - name: Stop containers
        if: always()
        run: docker compose down --remove-orphans
