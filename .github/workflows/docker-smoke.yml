name: NovaNexus container smoke test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_PASSWORD: ci-only-database-password
      BOOTSTRAP_ADMIN_PASSWORD: ci-only-temporary-administrator-password-long-enough
      LIVEKIT_API_KEY: novanexus
      LIVEKIT_API_SECRET: ci-only-livekit-secret-at-least-32-characters
      NOVANEXUS_DOMAIN: nexus.example.test
      TLS_EMAIL: ci@example.test
    steps:
      - uses: actions/checkout@v7
      - name: Prepare LiveKit media server configuration
        run: |
          cat > livekit.yaml <<'EOF'
          port: 7880
          rtc:
            tcp_port: 7881
            udp_port: 7882
            use_external_ip: false
            node_ip: 127.0.0.1
          room:
            max_participants: 1000
          keys:
            novanexus: ci-only-livekit-secret-at-least-32-characters
          EOF
      - name: Check installer syntax and runtime manifest
        run: |
          bash -n scripts/install.sh
          bash -n scripts/check-media.sh
          grep -q 'NOVANEXUS_MEDIA_MODE=public' scripts/install.sh
          grep -q 'use_external_ip: true' scripts/install.sh
          grep -q 'Cloudflare HTTP tunnels carry WSS signaling' scripts/check-media.sh
          docker compose config --quiet
          test -f Dockerfile
          test -f Caddyfile
          test -s public/nexus-workspace-logo.webp
          grep -q "/nexus-workspace-logo.webp" index.html
          grep -q "/nexus-workspace-logo.webp" src/App.jsx
      - name: Build non-root Go API image
        run: docker compose build app
      - name: Start PostgreSQL and Go API
        run: docker compose up -d db app
      - name: Verify container boot and internal health
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            if docker compose exec -T app wget -q -O - http://127.0.0.1:3000/api/health | grep -q '"ok"'; then
              docker compose exec -T app wget -q -O - http://127.0.0.1:3000/ | grep -q 'Nexus Workspace'
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail=100 app db
          exit 1
      - name: Verify frontend startup and missing asset behavior
        run: |
          set -euo pipefail
          docker compose exec -T app wget -qO- http://127.0.0.1:3000/ | grep -q 'nova-startup'
          docker compose exec -T app wget -qO- http://127.0.0.1:3000/boot-health.js | grep -q 'could not load'
          response=$(docker compose exec -T app wget -S -O /dev/null http://127.0.0.1:3000/assets/missing-file.js 2>&1 || true)
          printf '%s' "$response" | grep -q '404'
      - name: Verify IP-only HTTPS with local CA
        run: |
          set -euo pipefail
          grep -q 'default_sni {$NOVANEXUS_DOMAIN}' Caddyfile
          sed -i '/^{$NOVANEXUS_DOMAIN} {/a\    tls internal' Caddyfile
          NOVANEXUS_DOMAIN=127.0.0.1 docker compose up -d https
          docker compose ps --status running livekit
          docker compose up -d ollama
          docker compose exec -T ollama ollama list >/dev/null
          docker compose exec -T https caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          for n in $(seq 1 30); do
            if docker compose exec -T https cat /data/caddy/pki/authorities/local/root.crt > /tmp/novanexus-local-ca.crt 2>/dev/null && test -s /tmp/novanexus-local-ca.crt; then
              if curl -fsS --noproxy "*" --resolve "127.0.0.1:443:127.0.0.1" --cacert /tmp/novanexus-local-ca.crt https://127.0.0.1/api/health | grep -q '"status":"ok"'; then
                exit 0
              fi
            fi
            sleep 2
          done
          docker compose logs --tail=100 https app db
          exit 1
      - name: Verify simultaneous LAN IP and second HTTPS hostname
        run: |
          set -euo pipefail
          cat > additional-sites.caddy <<'EOF'
          nexus-public.example.test {
              tls internal
              import novanexus_routes
          }
          EOF
          docker compose exec -T https caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker compose restart https
          for n in $(seq 1 20); do
            if curl -fsS --noproxy "*" --resolve "nexus-public.example.test:443:127.0.0.1" --cacert /tmp/novanexus-local-ca.crt https://nexus-public.example.test/api/health | grep -q '"status":"ok"'; then
              curl -fsS --noproxy "*" --resolve "127.0.0.1:443:127.0.0.1" --cacert /tmp/novanexus-local-ca.crt https://127.0.0.1/api/health | grep -q '"status":"ok"'
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail=80 https
          exit 1
      - name: Verify embedded authenticated TURN UDP starts
        run: |
          set -euo pipefail
          cat >> livekit.yaml <<'EOF'
          turn:
            enabled: true
            udp_port: 3478
          EOF
          docker compose up -d --force-recreate livekit
          sleep 4
          docker compose ps --status running livekit | grep -q livekit
          docker compose logs --tail=30 livekit
      - name: Diagnose single Cloudflare HTTPS origin on port 443
        run: |
          set -euo pipefail
          bash -n scripts/check-cloudflare-origin.sh
          temp_root="$(mktemp -d)"
          printf '%s\n' 'NOVANEXUS_DOMAIN=127.0.0.1' > "$temp_root/.env"
          cp /tmp/novanexus-local-ca.crt "$temp_root/novanexus-local-root-ca.crt"
          NOVANEXUS_ROOT_DIR="$temp_root" bash scripts/check-cloudflare-origin.sh | grep -q 'PASS: Original HTTPS endpoint'
          rm -rf "$temp_root"
          docker compose config --format json | python3 -c 'import sys,json; ports=json.load(sys.stdin)["services"]["https"]["ports"]; assert sorted((str(p["target"]),p["protocol"]) for p in ports)==[("443","tcp"),("443","udp"),("80","tcp")],ports'
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=100 app db
      - name: Stop containers
        if: always()
        run: docker compose down --remove-orphans
