<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 510" role="img" aria-labelledby="title desc">
<title id="title">Nexus Workspace by Nova</title>
<desc id="desc">Purple rounded chat icon with a flowing white N, paired with Nexus Workspace by Nova.</desc>
<defs>
  <linearGradient id="purple" x1=".10" y1="0" x2=".85" y2="1">
    <stop offset="0" stop-color="#9900F0"/>
    <stop offset=".54" stop-color="#7100CD"/>
    <stop offset="1" stop-color="#4D008F"/>
  </linearGradient>
</defs>
<!-- Square chat mark remains legible at favicon size. -->
<path d="M82 32h285c45 0 82 36 82 81v246c0 45-37 81-82 81H184L92 488l17-63c-60-6-92-36-92-89V113c0-45 27-81 65-81Z" fill="url(#purple)"/>
<!-- Curved N with two people-like anchor points: white, clean and uncomplicated. -->
<path d="M86 263c2-83 45-141 109-141 47 0 76 35 111 82l48 63c9 12 17 16 22 4 7-17 8-48 8-78 0-19 8-34 26-34 18 0 26 16 26 34v94c0 52-17 87-53 93-40 7-64-21-103-71l-64-82c-21-26-36-34-52-25-18 10-25 36-26 66H86Z" fill="#FFFFFF"/>
<circle cx="139" cy="342" r="29" fill="#FFFFFF"/>
<path d="M100 421c3-35 19-54 39-54s38 19 44 54H100Z" fill="#FFFFFF"/>
<circle cx="362" cy="113" r="29" fill="#FFFFFF"/>
<!-- Clear typographic system without baked shadows or fake texture. -->
<g fill="#2B0746" font-family="Inter, 'Avenir Next', 'Segoe UI', Arial, sans-serif" font-weight="780" letter-spacing="-4">
  <text x="515" y="207" font-size="165">Nexus</text>
  <text x="512" y="354" font-size="145">Workspace</text>
</g>
<g font-family="Inter, 'Avenir Next', 'Segoe UI', Arial, sans-serif" font-weight="650">
 <text x="519" y="441" font-size="65" letter-spacing="-2" fill="#51336B">by</text>
 <text x="624" y="441" font-size="82" letter-spacing="-3" fill="#7900D4">Nova</text>
</g>
</svg>
